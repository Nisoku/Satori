<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="rubyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#b30000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7b1fa2;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background circle for better visibility -->
  <circle cx="256" cy="256" r="256" fill="#ffffff"/>
  <!-- Outer ripple -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#rubyGrad)" stroke-width="16" opacity="0.3"/>
  <!-- Middle ripple -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#rubyGrad)" stroke-width="20" opacity="0.6"/>
  <!-- Inner circle -->
  <circle cx="256" cy="256" r="96" fill="url(#rubyGrad)"/>
</svg>
